[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripmind"
version = "0.1.0"
description = "Autonomous Adaptive Trip Planner across 7 levels of Agentic AI"
authors = [{ name = "Anchal Nigam" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "groq>=0.13.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
