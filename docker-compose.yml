services:
  tripmind-db:
    image: postgres:16-alpine
    container_name: tripmind-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripmind
    ports:
      - "5433:5432"
    volumes:
      - tripmind_pgdata:/var/lib/postgresql/data

volumes:
  tripmind_pgdata:
